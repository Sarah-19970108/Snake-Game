<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Noodle Nibble</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: linear-gradient(160deg, #ffe259, #ff6fb5 55%, #7b5cff);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  #app {
    position: relative; height: 100%; max-width: 560px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
  }
  #hud {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 4px 6px 10px; font-weight: 700; font-size: 15px; text-shadow: 0 2px 0 rgba(0,0,0,.18);
  }
  #hud b { font-size: 20px; }
  #who { max-width: 38%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #wrap {
    flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(27, 16, 64, .35); border-radius: 22px; padding: 6px;
  }
  canvas {
    display: block; touch-action: none; border-radius: 16px; background: #1b1040;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .screen {
    position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px;
    background: rgba(40, 14, 90, .72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .hidden { display: none; }
  h1 { margin: 0; font-size: clamp(2.4rem, 12vw, 3.8rem); line-height: 1; text-shadow: 0 4px 0 #ff3d8b; }
  h2 { margin: 0; font-size: 2.4rem; text-shadow: 0 3px 0 #ff3d8b; }
  .sub { margin: 0; opacity: .9; font-size: 1rem; }
  input {
    width: min(100%, 280px); padding: 14px 16px; font-size: 1.1rem; text-align: center;
    border: 3px solid #fff; border-radius: 14px; outline: none; color: #2a1a5e; background: #fff;
  }
  input:focus { border-color: #ffe259; }
  button {
    width: min(100%, 280px); padding: 18px; font-size: 1.5rem; font-weight: 800; color: #3a1a00;
    background: linear-gradient(#ffe259, #ffa751); border: 0; border-radius: 18px; cursor: pointer;
    box-shadow: 0 6px 0 #c76a00, 0 12px 20px rgba(0,0,0,.3); transition: transform .1s, box-shadow .1s;
  }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #c76a00, 0 6px 10px rgba(0,0,0,.3); }
  .big { font-size: 3.2rem; font-weight: 800; }
  .new { color: #ffe259; font-weight: 800; font-size: 1.2rem; animation: pulse .7s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.15); } }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span id="who">Player</span>
    <span>Score <b id="sc">0</b></span>
    <span>Best <b id="bs">0</b></span>
  </div>
  <div id="wrap"><canvas id="cv"></canvas></div>

  <div id="title" class="screen">
    <h1>Noodle<br>Nibble</h1>
    <p class="sub">Swipe to turn. Eat to grow.<br>Don't hit the walls or yourself!</p>
    <input id="name" type="text" maxlength="12" placeholder="Your first name" autocomplete="off">
    <button id="play">Play</button>
    <p class="sub">Tap left/right, swipe, or use arrow keys / WASD</p>
  </div>

  <div id="over" class="screen hidden">
    <h2>Game over</h2>
    <p class="sub" id="msg"></p>
    <div class="big" id="final">0</div>
    <div class="new hidden" id="newbest">New best score!</div>
    <p class="sub">Best: <b id="best2">0</b></p>
    <button id="again">Play again</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d");
  const C = 16;                       // columns; rows depend on screen shape
  let R, cell, grid = false;
  let snake, prev, cur, queue, food, score, best, name, state = "title";
  let interval, last = 0, dieAt = 0, pops = [];

  // ---------- storage (safe if blocked) ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  best = parseInt(store.get("nn_best")) || 0;
  $("bs").textContent = best;
  $("name").value = store.get("nn_name") || "";

  // ---------- sound (WebAudio, starts after first tap) ----------
  let ac;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ac && ac.state === "suspended") ac.resume();
  }
  function tone(f1, f2, d, type = "sine", vol = 0.15) {
    if (!ac) return;
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + d);
  }
  document.addEventListener("pointerdown", audio);
  document.addEventListener("keydown", audio);

  // ---------- game setup ----------
  function newGame() {
    name = ($("name").value.trim() || "Player").slice(0, 12);
    store.set("nn_name", name);
    $("who").textContent = name;
    const wrap = $("wrap");
    const w = wrap.clientWidth - 12, h = wrap.clientHeight - 12;
    cell = Math.floor(w / C);
    R = Math.max(10, Math.floor(h / cell));
    const dpr = window.devicePixelRatio || 1;
    cv.width = C * cell * dpr; cv.height = R * cell * dpr;
    cv.style.width = C * cell + "px"; cv.style.height = R * cell + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    grid = true;

    const y = Math.floor(R / 2);
    snake = [{ x: 5, y }, { x: 4, y }, { x: 3, y }];
    prev = snake.map(s => ({ ...s }));
    cur = { x: 1, y: 0 }; queue = []; pops = [];
    score = 0; interval = 150;
    $("sc").textContent = 0; $("bs").textContent = best;
    spawnFood();
    $("title").classList.add("hidden");
    $("over").classList.add("hidden");
    state = "play"; last = performance.now();
    tone(300, 700, 0.18, "triangle", 0.12);
  }

  function spawnFood() {
    let p;
    do { p = { x: Math.floor(Math.random() * C), y: Math.floor(Math.random() * R) }; }
    while (snake.some(s => s.x === p.x && s.y === p.y));
    food = p;
  }

  function step() {
    if (queue.length) cur = queue.shift();
    const n = { x: snake[0].x + cur.x, y: snake[0].y + cur.y };
    const eat = n.x === food.x && n.y === food.y;
    const body = eat ? snake : snake.slice(0, -1);
    if (n.x < 0 || n.y < 0 || n.x >= C || n.y >= R || body.some(s => s.x === n.x && s.y === n.y)) return die();
    prev = snake.map(s => ({ ...s }));
    snake.unshift(n);
    if (!eat) snake.pop();
    else {
      score++;
      $("sc").textContent = score;
      pops.push({ x: n.x, y: n.y, t: performance.now() });
      interval = Math.max(65, 150 - score * 4);   // gets faster
      spawnFood();
      tone(520, 980, 0.12, "square", 0.07);
    }
  }

  function die() {
    state = "dying"; dieAt = performance.now();
    tone(320, 50, 0.55, "sawtooth", 0.14);
    const isNew = score > best;
    if (isNew) { best = score; store.set("nn_best", best); }
    setTimeout(() => {
      $("final").textContent = score;
      $("best2").textContent = best;
      $("msg").textContent = (isNew ? "Amazing, " : "Nice try, ") + name + "!";
      $("newbest").classList.toggle("hidden", !isNew);
      $("bs").textContent = best;
      $("over").classList.remove("hidden");
      state = "over";
    }, 700);
  }

  // ---------- input ----------
  function turn(dx, dy) {
    if (state !== "play") return;
    const l = queue.length ? queue[queue.length - 1] : cur;
    if ((dx === -l.x && dy === -l.y) || (dx === l.x && dy === l.y)) return;
    if (queue.length < 2) { queue.push({ x: dx, y: dy }); tone(260, 200, 0.04, "triangle", 0.05); }
  }
  const relTurn = left => {
    const l = queue.length ? queue[queue.length - 1] : cur;
    left ? turn(l.y, -l.x) : turn(-l.y, l.x);
  };

  let sx, sy, moved, active = false;
  cv.addEventListener("pointerdown", e => { active = true; moved = false; sx = e.clientX; sy = e.clientY; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => {
    if (!active) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 22) {
      Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
      moved = true; sx = e.clientX; sy = e.clientY;
    }
  });
  cv.addEventListener("pointerup", e => {
    if (active && !moved) {                        // a tap: turn left or right
      const r = cv.getBoundingClientRect();
      relTurn(e.clientX < r.left + r.width / 2);
    }
    active = false;
  });
  cv.addEventListener("pointercancel", () => active = false);

  const keys = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] };
  document.addEventListener("keydown", e => {
    const k = keys[e.key] || keys[e.key.toLowerCase()];
    if (k && state === "play" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); turn(k[0], k[1]); }
    else if (e.key === "Enter" || (e.key === " " && state === "over")) {
      if (state === "title" || state === "over") { e.preventDefault(); newGame(); }
    }
  });
  $("play").addEventListener("click", newGame);
  $("again").addEventListener("click", newGame);
  document.addEventListener("touchmove", e => { if (e.target === cv) e.preventDefault(); }, { passive: false });

  // ---------- drawing ----------
  const lerp = (a, b, t) => a + (b - a) * t;

  function draw(now) {
    const W = C * cell, H = R * cell;
    ctx.clearRect(0, 0, W, H);
    for (let y = 0; y < R; y++) for (let x = 0; x < C; x++) {
      if ((x + y) % 2) { ctx.fillStyle = "rgba(255,255,255,.045)"; ctx.fillRect(x * cell, y * cell, cell, cell); }
    }
    // food (pulsing berry with a leaf)
    const fx = (food.x + .5) * cell, fy = (food.y + .5) * cell, pr = cell * (.34 + .05 * Math.sin(now / 160));
    ctx.fillStyle = "#ff3d6e"; ctx.beginPath(); ctx.arc(fx, fy, pr, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.beginPath(); ctx.arc(fx - pr * .35, fy - pr * .35, pr * .22, 0, 7); ctx.fill();
    ctx.fillStyle = "#5dff8f"; ctx.beginPath(); ctx.ellipse(fx + pr * .3, fy - pr * .9, pr * .35, pr * .2, -.6, 0, 7); ctx.fill();

    // eat pops
    pops = pops.filter(p => now - p.t < 400);
    pops.forEach(p => {
      const k = (now - p.t) / 400;
      ctx.strokeStyle = `rgba(255,226,89,${1 - k})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc((p.x + .5) * cell, (p.y + .5) * cell, cell * (.4 + k), 0, 7); ctx.stroke();
    });

    // snake, interpolated between ticks for smooth motion
    const t = state === "play" ? Math.min(1, (now - last) / interval) : 1;
    const pts = snake.map((s, i) => {
      const p = prev[i] || prev[prev.length - 1];
      return { x: (lerp(p.x, s.x, t) + .5) * cell, y: (lerp(p.y, s.y, t) + .5) * cell };
    });
    ctx.globalAlpha = state === "dying" ? 0.45 + 0.35 * Math.sin((now - dieAt) / 40) : 1;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (let i = pts.length - 1; i > 0; i--) {
      ctx.strokeStyle = `hsl(${(150 + i * 9) % 360},90%,${58 - Math.min(i, 20)}%)`;
      ctx.lineWidth = cell * (.82 - Math.min(i, 12) * .012);
      ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[i - 1].x, pts[i - 1].y); ctx.stroke();
    }
    const h = pts[0], px = -cur.y, py = cur.x;   // head + eyes
    ctx.fillStyle = "hsl(150,95%,62%)"; ctx.beginPath(); ctx.arc(h.x, h.y, cell * .46, 0, 7); ctx.fill();
    [-1, 1].forEach(sd => {
      const ex = h.x + cur.x * cell * .14 + px * sd * cell * .2, ey = h.y + cur.y * cell * .14 + py * sd * cell * .2;
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex, ey, cell * .14, 0, 7); ctx.fill();
      ctx.fillStyle = "#1b1040"; ctx.beginPath(); ctx.arc(ex + cur.x * cell * .04, ey + cur.y * cell * .04, cell * .07, 0, 7); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function loop(now) {
    if (state === "play") {
      if (now - last > interval * 4) last = now;      // e.g. after switching tabs
      while (now - last >= interval) { last += interval; step(); if (state !== "play") break; }
    }
    if (grid) draw(now);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
